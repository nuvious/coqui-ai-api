name: Build and Push Docker Image

# The container image on ghcr.io/nuvious/coqui-ai-api is the project's committed
# primary distribution channel (see DESIGN.md, "Distribution"). This workflow
# publishes it on push to main, gated on the verify workflow passing, and no
# longer reads the deleted VERSION file.
#
# The old TTS==0.22.0-based image measured 16.9 GB, with a 2026-07-30 Trivy scan
# finding 435 HIGH and 24 CRITICAL findings inherited from its base. That is a
# pre-migration baseline, not a measurement of the slim-base image this workflow
# builds today, which remains unmeasured; see DESIGN.md, "Known deviations".

on:
  push:
    branches:
      - main

jobs:
  # The gate must pass before anything is published.
  verify:
    uses: ./.github/workflows/verify.yml

  build-and-push:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # pyproject.toml is the single source of truth for the version.
      - name: Read version from pyproject.toml
        id: version
        run: |
          VERSION=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          if [ -z "$VERSION" ]; then
            echo "could not read version from pyproject.toml" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          IMAGE_NAME=ghcr.io/${{ github.repository }}
          VERSION=${{ steps.version.outputs.VERSION }}

          docker build -t $IMAGE_NAME:$VERSION -t $IMAGE_NAME:latest .
          docker push $IMAGE_NAME:$VERSION
          docker push $IMAGE_NAME:latest
