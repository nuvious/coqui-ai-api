name: Verify

# CI runs the same gate a contributor runs locally: `make verify`. Adding a check
# means adding it to the Makefile, never to this file, so the two can never drift.

on:
  push:
    branches:
      - main
      - dev
  pull_request:
  # Callable so publishing workflows can require the gate before they run.
  workflow_call:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: make install

      - name: Run the gate
        run: make verify
