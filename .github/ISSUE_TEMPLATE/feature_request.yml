name: Feature request
description: Propose a change to the API surface, the worker, or the tooling.
labels: ["enhancement"]
body:
  - type: textarea
    id: outcome
    attributes:
      label: What outcome do you want
      description: Describe the result, not the implementation.
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why the current behavior is not enough
    validations:
      required: true

  - type: checkboxes
    id: surface
    attributes:
      label: Does this change the public API surface?
      description: Endpoint response shapes are treated as a contract (see CONTRIBUTING.md).
      options:
        - label: This adds or changes an endpoint, request body, or response shape.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
