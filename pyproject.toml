[project]
name = "coqui-ai-api"
version = "0.1.1"
description = "A REST API wrapper for the Coqui-AI TTS engine with voice cloning support."
authors = [
    { name = "David Cheeseman", email = "5287736+nuvious@users.noreply.github.com" }
]
requires-python = ">=3.10,<3.15"
dependencies = [
    "flask==3.1.3",
    "flask-cors==6.0.1",
    "flask-openapi3[elements,rapidoc,rapipdf,redoc,scalar,swagger]==4.2.1",
    "gunicorn==23.0.0",
    "pyyaml==6.0.2",
    "coqui-tts==0.27.5",
    # coqui-tts stopped bundling PyTorch at 0.27.4 (DESIGN.md, "The engine
    # dependency"). The version floor matches coqui-tts's own `cpu`/`cuda`
    # extras, which both require torch>=2.2 and differ only by which package
    # index serves the wheel, not by this requirement string. torchaudio is
    # required alongside it: TTS.tts.models.xtts imports it unconditionally,
    # so `from TTS.api import TTS` fails without it too. torchcodec is
    # required from torch 2.9 on: torch itself raises ImportError for audio IO
    # without it (coqui-tts's `codec` extra names the same requirement).
    "torch>=2.2",
    "torchaudio>=2.2",
    "torchcodec>=0.8.0",
]

[project.scripts]
coqui-ai-api = "coqui_ai_api.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# transformers is transitive through coqui-tts, not a direct dependency, so it
# is constrained rather than listed above. Pinned to 5.0.0 exactly: the newest
# release that still exports `transformers.pytorch_utils.isin_mps_friendly`,
# which coqui-tts 0.27.5's tortoise layer imports unconditionally. See
# DESIGN.md, "The transformers pin, and two accepted advisories".
#
# torch is pinned to the CPU wheel index. This is not the production-build
# decision DESIGN.md, "Open questions" ("which PyTorch does the project
# install") reserves — the Dockerfile does not install from uv.lock today
# (DESIGN.md, "Known deviations") and this task does not touch it (see
# T-01-01-02's Out of scope). It is the narrower, already-settled constraint
# that the dev container has no GPU and `make verify` must keep running in it
# without pulling a multi-gigabyte CUDA stack it cannot use.
[tool.uv]
constraint-dependencies = [
    "transformers==5.0.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }
torchcodec = { index = "pytorch-cpu" }

[dependency-groups]
dev = [
    "black>=25.11.0",
    "flake8>=7.3.0",
    "isort>=6.1.0",
    "mypy>=1.19.1",
    "pip-audit>=2.9.0",
    "pytest>=8.4.2",
    "pytest-cov>=7.1.0",
    "types-pyyaml>=6.0.12.20250915",
]

# Formatting: Black's own default line length. Source: https://black.readthedocs.io/,
# checked 2026-07-30.
[tool.black]
line-length = 88
target-version = ["py310"]

# Import ordering: the "black" profile is what Black documents for isort interop.
# Source: https://black.readthedocs.io/en/stable/guides/using_black_with_other_tools.html,
# checked 2026-07-30.
[tool.isort]
profile = "black"
line_length = 88

# Type checking is strict by default; the modules that predate the gate carry
# explicit per-module relaxations below and lose them as they are annotated.
[tool.mypy]
# Matches `requires-python` above. The floor is 3.10 because app.py uses PEP 604
# (`float | None`) in runtime-evaluated module-level annotations, which 3.9
# cannot execute. Source: PEP 604, https://peps.python.org/pep-0604/, checked
# 2026-07-30.
python_version = "3.10"
strict = true
files = ["src", "tests"]
warn_unused_configs = true
show_error_codes = true

# TTS, torch and flask_cors ship no type information.
[[tool.mypy.overrides]]
module = ["TTS.*", "flask_cors.*", "torch.*"]
ignore_missing_imports = true

# flask_openapi3 re-exports Info/OpenAPI/Tag without an explicit __all__.
[[tool.mypy.overrides]]
module = ["flask_openapi3.*"]
ignore_missing_imports = true
implicit_reexport = true

# Modules that predate the gate. They are checked, but not yet required to be
# fully annotated; drop an entry here as its module is annotated. New modules
# get no entry and are strict from the start (see estimator.py, already strict).
[[tool.mypy.overrides]]
module = [
    "coqui_ai_api.app",
    "conftest",
    "test_endpoints",
    "test_estimator",
    "test_health",
    "test_helpers",
    "test_job_expiration",
    "test_job_expiration_scheduling",
    "test_job_registry",
    "test_lock_ordering",
    "test_progress_eta",
    "test_smoke",
    "test_worker",
    "test_worker_state",
]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_any_generics = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
fail_under = 95
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
