[project]
name = "coqui-ai-api"
version = "0.1.1"
description = "A REST API wrapper for the Coqui-AI TTS engine with voice cloning support."
authors = [
    { name = "David Cheeseman", email = "5287736+nuvious@users.noreply.github.com" }
]
requires-python = ">=3.10,<3.12"
dependencies = [
    "flask==3.1.3",
    "flask-cors==6.0.1",
    "flask-openapi3[elements,rapidoc,rapipdf,redoc,scalar,swagger]==4.2.1",
    "gunicorn==23.0.0",
    "pyyaml==6.0.2",
    "coqui-tts==0.27.5",
]

[project.scripts]
coqui-ai-api = "coqui_ai_api.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "black>=25.11.0",
    "flake8>=7.3.0",
    "isort>=6.1.0",
    "mypy>=1.19.1",
    "pip-audit>=2.9.0",
    "pytest>=8.4.2",
    "pytest-cov>=7.1.0",
    "types-pyyaml>=6.0.12.20250915",
]

# Formatting: Black's own default line length. Source: https://black.readthedocs.io/,
# checked 2026-07-30.
[tool.black]
line-length = 88
target-version = ["py310"]

# Import ordering: the "black" profile is what Black documents for isort interop.
# Source: https://black.readthedocs.io/en/stable/guides/using_black_with_other_tools.html,
# checked 2026-07-30.
[tool.isort]
profile = "black"
line_length = 88

# Type checking is strict by default; the modules that predate the gate carry
# explicit per-module relaxations below and lose them as they are annotated.
[tool.mypy]
# Matches `requires-python` above. The floor is 3.10 because app.py uses PEP 604
# (`float | None`) in runtime-evaluated module-level annotations, which 3.9
# cannot execute. Source: PEP 604, https://peps.python.org/pep-0604/, checked
# 2026-07-30.
python_version = "3.10"
strict = true
files = ["src", "tests"]
warn_unused_configs = true
show_error_codes = true

# TTS, torch and flask_cors ship no type information.
[[tool.mypy.overrides]]
module = ["TTS.*", "flask_cors.*", "torch.*"]
ignore_missing_imports = true

# flask_openapi3 re-exports Info/OpenAPI/Tag without an explicit __all__.
[[tool.mypy.overrides]]
module = ["flask_openapi3.*"]
ignore_missing_imports = true
implicit_reexport = true

# Modules that predate the gate. They are checked, but not yet required to be
# fully annotated; drop an entry here as its module is annotated. New modules
# get no entry and are strict from the start (see estimator.py, already strict).
[[tool.mypy.overrides]]
module = [
    "coqui_ai_api.app",
    "conftest",
    "test_endpoints",
    "test_estimator",
    "test_health",
    "test_helpers",
    "test_job_expiration",
    "test_job_expiration_scheduling",
    "test_job_registry",
    "test_lock_ordering",
    "test_progress_eta",
    "test_smoke",
    "test_worker",
    "test_worker_state",
]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_any_generics = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
fail_under = 95
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
